# Public, repository-local setup for the `agents` macOS user.

[tools]
pnpm = "11.22.0"

[dotfiles]
"~/.config/mise/config.toml" = { source = "dotfiles/mise/config.toml", mode = "symlink" }
"~/.gitconfig" = { source = "dotfiles/gitconfig", mode = "symlink" }
"~/.zprofile" = { source = "dotfiles/zprofile", mode = "symlink" }
"~/.zshrc" = { source = "dotfiles/zshrc", mode = "symlink" }

[tasks.publish]
description = "Validate, commit, and push local dotfiles changes"
run = "./scripts/publish-dotfiles"
