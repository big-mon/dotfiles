# Public, repository-local setup for the `agents` macOS user.

[tools]
fd = "10.4.2"
jq = "1.8.2"
pnpm = "11.22.0"
python = "3.14.7"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
uv = "0.12.5"
yq = "4.53.6"

[dotfiles]
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
"~/.config/mise/mise.lock" = { source = "mise.lock", mode = "symlink" }
"~/.gitconfig" = { source = "dotfiles/gitconfig", mode = "symlink" }
"~/.zprofile" = { source = "dotfiles/zprofile", mode = "symlink" }
"~/.zshrc" = { source = "dotfiles/zshrc", mode = "symlink" }
